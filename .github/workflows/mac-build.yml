name: Personal macOS build

# Fork-only: builds an ad-hoc signed Apple Silicon app for personal use.
# There is no Apple Developer ID, so Gatekeeper asks once on first launch.

# Started by the t3-build script with the exact commit and version to build.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        default: multi-repo-workspaces
        type: string
      version:
        description: App version (t3-build passes <base>.multirepo-<sha>)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
          short_sha="$(git rev-parse --short=7 HEAD)"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(node -p "require('./apps/desktop/package.json').version").multirepo-$short_sha"
          fi
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          echo "T3CODE_DESKTOP_VERSION=$VERSION" >> "$GITHUB_ENV"

      # SSH remotes download t3-<app version> from upstream releases by default.
      # t3-build publishes this build's server on the fork's releases; point
      # remotes there so they run the same fork build as this app.
      - name: Point SSH remotes at the fork's releases
        shell: bash
        run: |
          set -euo pipefail
          runner=apps/desktop/src/main.ts
          grep -q 'return { archiveVersion: environment.appVersion };' "$runner" ||
            { echo "SSH runner line changed upstream; update this patch" >&2; exit 1; }
          sed -i '' "s|return { archiveVersion: environment.appVersion };|return { archiveVersion: environment.appVersion, releaseBaseUrl: \"https://github.com/${GITHUB_REPOSITORY}/releases/download\" };|" "$runner"
          grep -n 'archiveVersion: environment.appVersion' "$runner"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # Like t3-build-fork: no update feed, so the app never offers an
        # upstream or fork release in place of this build.
        run: env -u GITHUB_REPOSITORY -u T3CODE_DESKTOP_UPDATE_REPOSITORY node scripts/build-desktop-artifact.ts --platform mac --target zip --arch arm64

      # Electron's own signature breaks once the bundle is customized, and an
      # arm64 Mac refuses to run unsigned code, so sign the whole bundle ad hoc.
      - name: Ad-hoc sign and repackage
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$(ls release/*.zip | head -n1)"
          mkdir -p "$RUNNER_TEMP/app" out
          ditto -x -k "$zip_path" "$RUNNER_TEMP/app"
          app_path="$(ls -d "$RUNNER_TEMP"/app/*.app | head -n1)"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "out/T3-Code-${T3CODE_DESKTOP_VERSION}-arm64-mac.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: T3-Code-${{ env.T3CODE_DESKTOP_VERSION }}-arm64-mac
          path: out/*.zip
          compression-level: 0
          retention-days: 14
